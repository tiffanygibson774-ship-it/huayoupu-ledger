name: Build ARM64 Debug APK

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: ARM64 Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Cache pinned public SDK and model inputs
        uses: actions/cache@v4
        with:
          path: .tools/ocr-ab
          key: v6-public-inputs-${{ runner.os }}-${{ hashFiles('third_party/ocr-runtime/config/upstream-lock.json', 'third_party/ocr-runtime/config/paddle-sdk.gradle.kts', 'scripts/prepare-paddle-sdk.py') }}
      - name: Prepare inputs and build ARM64 Debug APK
        run: |
          python scripts/prepare-ledger-build.py
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          bash ./gradlew -PledgerAbi=arm64-v8a :app:assembleDebug --stacktrace
          mkdir -p ci-artifacts
          cp app/build/outputs/apk/debug/*.apk ci-artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: huayoupu-ledger-arm64-debug
          path: ci-artifacts/*.apk
          if-no-files-found: error
